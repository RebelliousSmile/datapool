<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>datapool</title>
    <script>
      // Thème appliqué avant le premier rendu (pas de flash) ; sombre par défaut.
      try {
        if (localStorage.getItem('datapool.theme') === 'light') document.documentElement.dataset.theme = 'light';
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div class="app-root">%sveltekit.body%</div>
  </body>
</html>
